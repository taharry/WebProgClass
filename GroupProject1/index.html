<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="styles.css"/>
  <title>Blackjack — Card Dealer Demo</title>
</head>
<body>

  <!-- HOME -->
  <section id="home" class="screen screen--home">
    <div class="home-card">
      <h1 class="title">Blackjack</h1>
      <a class="btn-start" href="#table" aria-label="Start the Blackjack dealer demo">Start</a>
      <span class="suit tl" aria-hidden="true">♠</span>
      <span class="suit br" aria-hidden="true">♠</span>
    </div>
  </section>

  <!-- TABLE SCREEN -->
  <section id="table" class="screen screen--table">
    <header class="topbar">
      <a class="link" href="#home">Home</a>
      <div class="topbar-title">Blackjack Dealer </div>
      <!-- Reload page to reset any future animations -->
      <a class="link" href="#">Restart</a>
    </header>

    <div class="table">

      <div class="dealer">
        <h1>Dealer section</h1>
      </div>

      <div class="gap" aria-hidden="true"></div>

      <div class="players">
        <div class="p1"><h3>Player 1</h3></div>
        <div class="p2"><h3>Player 2</h3></div>
        <div class="p3"><h3>Player 3</h3></div>
      </div>
    </div>
  </section>

</body>
</html>
